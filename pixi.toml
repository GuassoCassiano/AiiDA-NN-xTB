[workspace]
name = "aiida-nn-xtb"
version = "0.3.0"
description = "AiiDA Plugin for easier use of NN-xTB energy calculations"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Core Language
python = "==3.11"

# Chemistry
rdkit = ">=2024"

# Testing Framework
pytest = ">=8"

# Build and package Utilities
pip = "*"
setuptools = "<80"

# Data Processing & Export
zarr = "<3"
numpy = ">=2.4.6,<3"
rabbitmq-server = "3.12.*"
postgresql = "15.*"
xtb = ">=6.7.1,<7"
wrapt = "<2"
aiida-workgraph = ">=0.7.1,<0.8"
ase = ">=3.29.0,<4"

[pypi-dependencies]
aiida-nn-xtb = { path = ".", editable = true }
aiida-core = { version = ">=2.8.0,<3" }
aiida-gui-workgraph = ">=0.1.3, <0.2"

[tasks]
test = "pytest tests/ -v"
